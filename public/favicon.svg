<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <style>
    .lamp-icon {
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.22));
    }
    @media (prefers-color-scheme: dark) {
      .lamp-icon {
        filter: invert(1) drop-shadow(0 3px 8px rgba(255, 255, 255, 0.25));
      }
    }
  </style>
  <image class="lamp-icon" href="data:image/png;base64," width="300" height="300" />
</svg>
