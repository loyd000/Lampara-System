<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Sun rays -->
  <g opacity="0.3" stroke="#fff" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="100" x2="256" y2="60"/>
    <line x1="340" y1="120" x2="368" y2="88"/>
    <line x1="395" y1="175" x2="427" y2="147"/>
    <line x1="172" y1="120" x2="144" y2="88"/>
    <line x1="117" y1="175" x2="85" y2="147"/>
  </g>
  <!-- Sun circle -->
  <circle cx="256" cy="200" r="72" fill="url(#glow)" opacity="0.9"/>
  <!-- Lamp / house base -->
  <path d="M160 320 L256 240 L352 320 Z" fill="white" opacity="0.95"/>
  <rect x="185" y="320" width="142" height="100" rx="4" fill="white" opacity="0.95"/>
  <!-- Window -->
  <rect x="232" y="340" width="48" height="55" rx="4" fill="url(#bg)" opacity="0.7"/>
  <!-- Letter L -->
  <text x="256" y="390" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">L</text>
</svg>
