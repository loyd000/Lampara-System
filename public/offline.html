<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Lampara CRM</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --background: #f5f5f7;
            --foreground: #1d1d1f;
            --muted-foreground: #6e6e73;
            --primary: #0071e3;
            --primary-foreground: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #0a0e15;
                --foreground: #f5f5f7;
                --muted-foreground: #667085;
                --primary: #0a84ff;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--background);
            color: var(--foreground);
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 400px;
        }

        .icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 1.25rem;
            color: var(--muted-foreground);
        }

        .icon svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.75rem;
            color: var(--foreground);
        }

        p {
            color: var(--muted-foreground);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        button {
            background: var(--primary);
            color: var(--primary-foreground);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 6h22l-2 13H3L1 6zm11-4a4 4 0 0 1 4 4H8a4 4 0 0 1 4-4z" />
            </svg>
        </div>
        <h1>You're offline</h1>
        <p>Please check your internet connection and try again. Lampara CRM requires a connection to load your data.</p>
        <button onclick="window.location.reload()">Try again</button>
    </div>
</body>

</html>
