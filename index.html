<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lampara CRM</title>
    <meta name="description" content="Lampara — Solar Installation CRM for managing your pipeline from inquiry to installation." />
    <meta name="author" content="Lampara" />
    <link rel="icon" href="/lampara-icon.png" type="image/png" />
    <meta property="og:title" content="Lampara CRM" />
    <meta property="og:description" content="Solar Installation CRM — manage leads, surveys, quotes, permits, and installations in one place." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />

    <!-- PWA Configuration -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0A0E15" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Lampara" />
    <link rel="apple-touch-icon" href="/lampara-icon.png" />

    <!--
      iOS launch splash screens. Unlike Android, iOS generates nothing from the
      manifest's icons/background_color — each screen size needs its own exact
      pixel-dimension PNG plus a media query pinned to that device, or the
      install just shows a blank white flash between tapping the icon and the
      app painting. Covers the common iPhone sizes from the last several
      generations, portrait only (the manifest locks orientation to
      portrait-primary, so a landscape splash is never shown anyway).
    -->
    <link rel="apple-touch-startup-image" href="/apple-splash-750-1334.png"
        media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-828-1792.png"
        media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1125-2436.png"
        media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1242-2688.png"
        media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1170-2532.png"
        media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1284-2778.png"
        media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1179-2556.png"
        media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1290-2796.png"
        media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" crossorigin />

    <!-- Detect dark mode preference and set the class before next-themes loads. This avoids a flash of unstyled content (FOUC) when the page loads. -->
    <script>
        try {
            let theme = localStorage.getItem("theme");
            if (theme === "system" || !theme) {
                let prefersDark = window.matchMedia(
                    "(prefers-color-scheme: dark)",
                ).matches;
                theme = prefersDark ? "dark" : "light";
            }
            document.documentElement.classList.add(theme);
        } catch (e) { }
    </script>

    <link href="/src/index.css" rel="stylesheet" />
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
